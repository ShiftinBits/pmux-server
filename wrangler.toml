name = "pmux-signaling"
main = "src/worker.ts"
compatibility_date = "2026-02-23"
compatibility_flags = ["web_socket_auto_reply_to_close"]
workers_dev = false
preview_urls = false

routes = [
  { pattern = "signal.pmux.io", zone_name = "pmux.io", custom_domain = true }
]

[observability]
enabled = true

[observability.logs]
enabled = true

[placement]
mode = "smart"

[durable_objects]
bindings = [
  { name = "SIGNALING", class_name = "SignalingDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingDO"]

# Native Workers Rate Limiting bindings (period must be 10 or 60).
# Replaces the former custom DO-KV fixed-window limiter [SB-995].
[[ratelimits]]
name = "TOKEN_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Shared by /pair/initiate, /pair/complete, /pairing, /device. Keys are
# namespaced by endpoint in signaling.ts, so the 10/60s limit is per-endpoint
# (independent counters), not a single shared bucket.
[[ratelimits]]
name = "PAIR_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "TURN_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "WS_LIMITER"
namespace_id = "1004"
simple = { limit = 8, period = 10 }

# Environment secrets (set via `wrangler secret put`):
# - TURN_API_TOKEN
# - TURN_TOKEN_ID
# - JWT_SECRET
# - PMUX_HMAC_SECRET  (optional) — enables HMAC-SHA256 client signature validation;
#                     when set, all requests (except /health and /) must include
#                     valid `pmux-signature` and `pmux-timestamp` headers
#
# Auth challenge settings (optional; `.dev.vars` locally):
# - PMUX_AUTH_ORIGINS — comma-separated origins (`scheme://host[:port]`) that
#                     /token and /pair/initiate signatures may be bound to. When
#                     unset, the request origin is used: correct in production
#                     (https://signal.pmux.io), but `wrangler dev` rewrites the
#                     request URL to http://signal.pmux.io, so for local dev set
#                     it to the URL clients dial, e.g. http://192.168.1.5:8787
# - PMUX_REJECT_LEGACY_AUTH — `true` rejects the legacy unbound `deviceId|nonce`
#                     challenge signature. Older agent/mobile builds sign only
#                     that form; set this once every supported agent and mobile
#                     release signs the origin-bound form, then remove the
#                     legacy fallback from the code.
